[package]
name = "clear"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16"
dialoguer = "0.12.0"
dirs = "7.0.0"
glob = "0.3.4"
humansize = "2.1.3"
indicatif = "0.18.6"
jwalk = "0.9.0"
plist = "1.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = "1.1.6"
trash = "5.2.9"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "clr"
path = "src/main.rs"
